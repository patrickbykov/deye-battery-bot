# Окремий застосунок від deye-battery-bot: інші креденшели, інший профіль
# відмов, і бот сидить на волюмі з SQLite — рестарт колектора не має його чіпати.
app = 'deye-collector'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  COLLECT_INTERVAL = '90000'
  INFLUX_BUCKET = 'monitoring'

# Публічного HTTP колектору не треба, але health-check потрібен: він єдиний
# спосіб ззовні побачити, що цикл збору став. Порт не експонується назовні —
# перевірку виконує сам Fly всередині мережі.
[checks]
  [checks.cycle]
    type = 'http'
    port = 8080
    method = 'get'
    path = '/'
    interval = '60s'
    timeout = '10s'
    grace_period = '60s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
