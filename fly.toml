# fly.toml app configuration file for deye-battery-bot

app = 'deye-battery-bot'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  # Раніше перевірок не було взагалі: HTTP-сервер існував лише щоб задовольнити
  # [http_service], і Fly його ніколи не опитував. Тепер ендпойнт віддає 503,
  # коли полінг Telegram стоїть, і це стає видно в `fly status`.
  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/'

# Було memory = '1gb' і memory_mb = 256 в одному блоці — конфлікт, фактично
# машина піднімалась як 256MB. Лишаємо явно те, що є насправді.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1

[mounts]
  source = 'bot_data'
  destination = '/app/data'
